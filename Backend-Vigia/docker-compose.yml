# docker-compose.yml
services:

  # ─────────────────────────────────────────
  # INFRAESTRUCTURA
  # ─────────────────────────────────────────

  postgres-usuarios:
    image: postgres:16-alpine
    container_name: postgres-usuarios
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USUARIOS_DB}
      POSTGRES_USER: ${USUARIOS_DB_USER}
      POSTGRES_PASSWORD: ${USUARIOS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USUARIOS_DB_USER} -d ${USUARIOS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-novedades:
    image: postgres:16-alpine
    container_name: postgres-novedades
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOVEDADES_DB}
      POSTGRES_USER: ${NOVEDADES_DB_USER}
      POSTGRES_PASSWORD: ${NOVEDADES_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_novedades_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOVEDADES_DB_USER} -d ${NOVEDADES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-reportes:
    image: postgres:16-alpine
    container_name: postgres-reportes
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REPORTES_DB}
      POSTGRES_USER: ${REPORTES_DB_USER}
      POSTGRES_PASSWORD: ${REPORTES_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_reportes_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPORTES_DB_USER} -d ${REPORTES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-ubicaciones:
    image: postgres:16-alpine
    container_name: postgres-ubicaciones
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UBICACIONES_DB}
      POSTGRES_USER: ${UBICACIONES_DB_USER}
      POSTGRES_PASSWORD: ${UBICACIONES_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_ubicaciones_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UBICACIONES_DB_USER} -d ${UBICACIONES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      # Forzar issuer consistente: tokens emitidos con localhost:8180
      # para que coincida con lo que ven el frontend y los microservicios
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realms:/opt/keycloak/data/import
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready | grep -q UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  # =========================================
  # MICROSERVICIOS
  # =========================================

  micro-usuarios:
    build:
      context: ./micro-usuarios
      dockerfile: Dockerfile
    container_name: micro-usuarios
    restart: unless-stopped
    env_file:
      - ./micro-usuarios/.env
    ports:
      - "${USUARIOS_PORT}:${USUARIOS_PORT}"
    networks:
      - backend
    depends_on:
      postgres-usuarios:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started

  micro-ubicaciones:
    build:
      context: ./micro-ubicaciones
      dockerfile: Dockerfile
    container_name: micro-ubicaciones
    restart: unless-stopped
    env_file:
      - ./micro-ubicaciones/.env
    ports:
      - "${UBICACIONES_PORT}:${UBICACIONES_PORT}"
    networks:
      - backend
    depends_on:
      postgres-ubicaciones:
        condition: service_healthy

  micro-novedades:
    build:
      context: ./MicroservicioNovedades
      dockerfile: Dockerfile
    container_name: micro-novedades
    restart: unless-stopped
    env_file:
      - ./MicroservicioNovedades/.env
    ports:
      - "5003:5003"
    volumes:
      - novedades_evidencias:/app/evidencias
    networks:
      - backend
    depends_on:
      postgres-novedades:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ./APIGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - ./APIGateway/.env
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      keycloak:
        condition: service_started
      micro-usuarios:
        condition: service_started
      micro-ubicaciones:
        condition: service_started
      micro-novedades:
        condition: service_started

  micro-reportes:
    build:
      context: ./MicroservicioReportes
      dockerfile: Dockerfile
    container_name: micro-reportes
    restart: unless-stopped
    env_file:
      - ./MicroservicioReportes/.env
    ports:
      - "5004:5004"
    volumes:
      - reportes_temp:/app/reportes-temp
    networks:
      - backend
    depends_on:
      postgres-reportes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      micro-novedades:
        condition: service_started

# =========================================
# VOLÚMENES Y RED
# =========================================

volumes:
  postgres_usuarios_data:
  postgres_novedades_data:
  postgres_reportes_data:
  postgres_ubicaciones_data:
  rabbitmq_data:
  keycloak_data:
  novedades_evidencias:
  reportes_temp:

networks:
  backend:
    driver: bridge