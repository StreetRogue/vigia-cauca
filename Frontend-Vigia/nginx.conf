server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Subidas grandes (carga de Excel, evidencias)
    client_max_body_size 50m;

    # Compresión
    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;

    # DNS interno de Docker — resuelve los nombres de servicio en tiempo de
    # ejecución, así nginx arranca aunque el backend aún no esté listo.
    resolver 127.0.0.11 valid=10s;

    # ── SPA (React Router): cualquier ruta desconocida cae en index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index.html NUNCA se cachea: garantiza que tras un deploy el navegador
    # reciba el bundle con el hash nuevo (los /assets/ sí se cachean 1 año
    # porque su nombre cambia con cada build).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # ── API Gateway: todas las llamadas /api/... del frontend ──
    location /api/ {
        set $upstream_gateway http://api-gateway:8080;
        proxy_pass $upstream_gateway$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para SSE (server-sent events) y respuestas largas
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # ── Keycloak: refresco de token desde el navegador ──
    location /realms/ {
        set $upstream_keycloak http://keycloak:8080;
        proxy_pass $upstream_keycloak$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Caché de assets estáticos con hash de Vite ──
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}
