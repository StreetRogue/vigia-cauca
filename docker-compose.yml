# =====================================================================
# docker-compose.yml — Vigía Cauca (stack completo)
#
# Uso:
#   docker compose up -d --build
#
# Todas las variables se leen del único .env en la raíz del proyecto.
# =====================================================================
services:

  # ─────────────────────────────────────────
  # INFRAESTRUCTURA
  # ─────────────────────────────────────────

  postgres-usuarios:
    image: postgres:16-alpine
    container_name: postgres-usuarios
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${USUARIOS_DB}
      POSTGRES_USER:     ${USUARIOS_DB_USER}
      POSTGRES_PASSWORD: ${USUARIOS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USUARIOS_DB_USER} -d ${USUARIOS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-ubicaciones:
    image: postgres:16-alpine
    container_name: postgres-ubicaciones
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${UBICACIONES_DB}
      POSTGRES_USER:     ${UBICACIONES_DB_USER}
      POSTGRES_PASSWORD: ${UBICACIONES_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_ubicaciones_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UBICACIONES_DB_USER} -d ${UBICACIONES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-novedades:
    image: postgres:16-alpine
    container_name: postgres-novedades
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${NOVEDADES_DB}
      POSTGRES_USER:     ${NOVEDADES_DB_USER}
      POSTGRES_PASSWORD: ${NOVEDADES_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_novedades_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOVEDADES_DB_USER} -d ${NOVEDADES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-reportes:
    image: postgres:16-alpine
    container_name: postgres-reportes
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${REPORTES_DB}
      POSTGRES_USER:     ${REPORTES_DB_USER}
      POSTGRES_PASSWORD: ${REPORTES_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_reportes_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPORTES_DB_USER} -d ${REPORTES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_HEALTH_ENABLED:       "true"
      KC_HOSTNAME:             localhost:8180
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY:                reencrypt
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./Backend-Vigia/Keycloak/realms:/opt/keycloak/data/import
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F90' /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak-init:
    image: alpine:3.19
    container_name: keycloak-init
    volumes:
      - ./Backend-Vigia/Keycloak/init-admin-user.sh:/init-admin-user.sh:ro
    command: sh -c "apk add --no-cache curl -q && sh /init-admin-user.sh"
    networks:
      - backend
    depends_on:
      - keycloak
    restart: on-failure

  # ─────────────────────────────────────────
  # MICROSERVICIOS
  # ─────────────────────────────────────────

  micro-usuarios:
    build:
      context: ./Backend-Vigia/micro-usuarios
      dockerfile: Dockerfile
    container_name: micro-usuarios
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE:   dev
      APP_PORT:                 ${USUARIOS_PORT}
      DB_URL:                   ${USUARIOS_DB_URL}
      DB_USER:                  ${USUARIOS_DB_USER}
      DB_PASSWORD:              ${USUARIOS_DB_PASSWORD}
      RABBITMQ_HOST:            ${RABBITMQ_HOST}
      RABBITMQ_PORT:            ${RABBITMQ_PORT}
      RABBITMQ_USER:            ${RABBITMQ_USER}
      RABBITMQ_PASSWORD:        ${RABBITMQ_PASSWORD}
      KEYCLOAK_SERVER_URL:      ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM_NAME:      ${KEYCLOAK_REALM}
      KEYCLOAK_REALM_MASTER:    ${KEYCLOAK_REALM_MASTER}
      KEYCLOAK_ADMIN_CLI:       ${KEYCLOAK_ADMIN_CLI}
      KEYCLOAK_USER_CONSOLE:    ${KEYCLOAK_USER}
      KEYCLOAK_CONSOLE_PASSWORD: ${KEYCLOAK_PASSWORD}
      KEYCLOAK_CLIENT_ID:       ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET:   ${KEYCLOAK_CLIENT_SECRET_USUARIOS}
      KEYCLOAK_ISSUER_URI:      ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI:     ${KEYCLOAK_JWK_SET_URI}
      AUTH0_ISSUER_URI:         ${KEYCLOAK_INTERNAL_URL}
      AUTH0_CLIENT_ID:          ${KEYCLOAK_CLIENT_ID}
      AUTH0_CLIENT_SECRET:      ${KEYCLOAK_CLIENT_SECRET_USUARIOS}
      AUTH0_API_AUDIENCE:       ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
      ROL_ADMIN:                ${ROL_ADMIN}
      ROL_OPERADOR:             ${ROL_OPERADOR}
    ports:
      - "${USUARIOS_PORT}:${USUARIOS_PORT}"
    networks:
      - backend
    depends_on:
      postgres-usuarios:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  micro-ubicaciones:
    build:
      context: ./Backend-Vigia/micro-ubicaciones
      dockerfile: Dockerfile
    container_name: micro-ubicaciones
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_PORT:               ${UBICACIONES_PORT}
      DB_URL:                 ${UBICACIONES_DB_URL}
      DB_USER:                ${UBICACIONES_DB_USER}
      DB_PASSWORD:            ${UBICACIONES_DB_PASSWORD}
      KEYCLOAK_ISSUER_URI:    ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_CLIENT_ID:     ${KEYCLOAK_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
    ports:
      - "${UBICACIONES_PORT}:${UBICACIONES_PORT}"
    networks:
      - backend
    depends_on:
      postgres-ubicaciones:
        condition: service_healthy

  api-gateway:
    build:
      context: ./Backend-Vigia/APIGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT:          ${GATEWAY_PORT}
      KEYCLOAK_ISSUER_URI:  ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_CLIENT_ID:   ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET_GATEWAY}
      KEYCLOAK_TOKEN_URL:   ${KEYCLOAK_TOKEN_URL}
      KEYCLOAK_LOGOUT_URL:  ${KEYCLOAK_LOGOUT_URL}
      JWT_AUDIENCE:         ${KEYCLOAK_CLIENT_ID}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      - backend
    depends_on:
      keycloak:
        condition: service_healthy

  micro-novedades:
    build:
      context: ./Backend-Vigia/MicroservicioNovedades
      dockerfile: Dockerfile
    container_name: micro-novedades
    restart: unless-stopped
    environment:
      PORT:                      ${NOVEDADES_PORT}
      NOVEDADES_DB_URL:          ${NOVEDADES_DB_URL}
      NOVEDADES_DB_USER:         ${NOVEDADES_DB_USER}
      NOVEDADES_DB_PASS:         ${NOVEDADES_DB_PASSWORD}
      SPRING_RABBITMQ_HOST:      ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT:      ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME:  ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD:  ${RABBITMQ_PASSWORD}
      CLIENTS_USUARIOS_BASE_URL: ${CLIENTS_USUARIOS_BASE_URL}
      RABBITMQ_QUEUE_NAME:       ${RABBITMQ_QUEUE_NOVEDADES_NOTIF}
      EVIDENCIAS_PATH:           ${EVIDENCIAS_PATH}
      KEYCLOAK_ISSUER_URI:       ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_CLIENT_ID:        ${KEYCLOAK_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
    ports:
      - "${NOVEDADES_PORT}:${NOVEDADES_PORT}"
    volumes:
      - evidencias_data:/app/evidencias
    networks:
      - backend
    depends_on:
      postgres-novedades:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  micro-reportes:
    build:
      context: ./Backend-Vigia/MicroservicioReportes
      dockerfile: Dockerfile
    container_name: micro-reportes
    restart: unless-stopped
    environment:
      PORT:                       ${REPORTES_PORT}
      REPORTES_DB_URL:            ${REPORTES_DB_URL}
      REPORTES_DB_USER:           ${REPORTES_DB_USER}
      REPORTES_DB_PASS:           ${REPORTES_DB_PASSWORD}
      SPRING_RABBITMQ_HOST:       ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT:       ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME:   ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD:   ${RABBITMQ_PASSWORD}
      CLIENTS_NOVEDADES_BASE_URL: ${CLIENTS_NOVEDADES_BASE_URL}
      RABBITMQ_QUEUE_NOVEDADES:   ${RABBITMQ_QUEUE_NOVEDADES_STATS}
      RABBITMQ_EXCHANGE_NOVEDADES: ${RABBITMQ_EXCHANGE_NOVEDADES}
      RABBITMQ_RK_NOVEDADES:      ${RABBITMQ_RK_NOVEDADES}
      REPORTES_TEMP_DIR:          ${REPORTES_TEMP_DIR}
      KEYCLOAK_ISSUER_URI:        ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_CLIENT_ID:         ${KEYCLOAK_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
    ports:
      - "${REPORTES_PORT}:${REPORTES_PORT}"
    volumes:
      - reportes_data:/app/reportes-temp
    networks:
      - backend
    depends_on:
      postgres-reportes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────

  frontend:
    build:
      context: ./Frontend-Vigia
      dockerfile: Dockerfile
      args:
        VITE_API_GATEWAY_URL:   "${VITE_API_GATEWAY_URL:-}"
        VITE_KEYCLOAK_URL:      "${VITE_KEYCLOAK_URL:-}"
        VITE_KEYCLOAK_REALM:    "${VITE_KEYCLOAK_REALM:-security-realm-dev}"
        VITE_KEYCLOAK_CLIENT_ID: "${VITE_KEYCLOAK_CLIENT_ID:-api-gateway}"
        VITE_API_MODE:          "${VITE_API_MODE:-gateway}"
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - backend
    depends_on:
      - api-gateway
      - keycloak

# ─────────────────────────────────────────
# VOLÚMENES Y RED
# ─────────────────────────────────────────

volumes:
  postgres_usuarios_data:
  postgres_ubicaciones_data:
  postgres_novedades_data:
  postgres_reportes_data:
  rabbitmq_data:
  keycloak_data:
  evidencias_data:
  reportes_data:

networks:
  backend:
    driver: bridge
